<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }
  .game-wrapper {
    background: #16213e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: #e0e0e0;
  }
  .game-title { font-size: 20px; font-weight: bold; color: #f39c12; letter-spacing: 2px; }
  .game-stats { display: flex; gap: 24px; font-size: 14px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-value { color: #f39c12; font-weight: bold; font-size: 16px; }
  canvas {
    display: block;
    border: 3px solid #0f3460;
    border-radius: 6px;
    background: #2d2d2d;
  }
  .game-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    color: #888;
    font-size: 12px;
  }
  .controls-hint span { color: #f39c12; }
  button {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover { background: #c0392b; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-header">
    <div class="game-title">&#x1F4A5; 坦克大战</div>
    <div class="game-stats">
      <div class="stat">&#x1F4AF; 分数 <span class="stat-value" id="score">0</span></div>
      <div class="stat">&#x2620; 敌人 <span class="stat-value" id="enemies">0</span></div>
      <div class="stat">&#x2764; 生命 <span class="stat-value" id="lives">3</span></div>
    </div>
  </div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>
  <div class="game-footer">
    <div class="controls-hint">
      <span>WASD</span> 移动 &nbsp; <span>空格</span> 射击 &nbsp; <span>P</span> 暂停
    </div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 600, H = 600;
const TILE = 30;
const COLS = W / TILE, ROWS = H / TILE;

// DOM elements
const scoreEl = document.getElementById('score');
const enemiesEl = document.getElementById('enemies');
const livesEl = document.getElementById('lives');

// Game state
let game = { score: 0, lives: 3, level: 1, paused: false, over: false, won: false };
let keys = {};
let player = null;
let enemies = [];
let bullets = [];
let walls = [];
let explosions = [];
let particles = [];
let spawnTimer = 0;
let enemyCount = 0;
const MAX_ENEMIES = 6;
const TOTAL_ENEMIES_PER_LEVEL = 10;
let spawnInterval = 180;

// Directions
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

// --- Classes ---
class Tank {
  constructor(x, y, color, isPlayer = false) {
    this.x = x; this.y = y;
    this.w = TILE - 2; this.h = TILE - 2;
    this.dir = DIR.UP;
    this.speed = isPlayer ? 2 : 1.2;
    this.color = color;
    this.isPlayer = isPlayer;
    this.alive = true;
    this.cooldown = 0;
    this.cooldownMax = isPlayer ? 15 : 40;
    this.moveTimer = 0;
    this.aiDir = DIR.UP;
    this.aiChangeTimer = 0;
    this.shootTimer = 0;
    this.shootDelay = isPlayer ? 0 : 30 + Math.random() * 40;
    this.hp = isPlayer ? 1 : 1;
    this.flash = 0;
    this.shieldTimer = isPlayer ? 120 : 0;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }

  draw() {
    if (!this.alive) return;

    ctx.save();
    ctx.translate(this.cx, this.cy);

    // Shield effect (spawn protection)
    if (this.shieldTimer > 0) {
      ctx.strokeStyle = `rgba(0, 200, 255, ${0.3 + 0.3 * Math.sin(this.shieldTimer * 0.2)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, this.w * 0.8, 0, Math.PI * 2);
      ctx.stroke();
    }

    let angle = this.dir * Math.PI / 2;
    ctx.rotate(angle);

    // Body
    const hw = this.w / 2, hh = this.h / 2;
    ctx.fillStyle = this.flash > 0 ? '#fff' : this.color;
    ctx.fillRect(-hw + 2, -hh + 2, this.w - 4, this.h - 4);

    // Treads
    ctx.fillStyle = this.flash > 0 ? '#ccc' : '#555';
    ctx.fillRect(-hw, -hh, 4, this.h);
    ctx.fillRect(hw - 4, -hh, 4, this.h);
    // Tread details
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = this.flash > 0 ? '#aaa' : '#444';
      ctx.fillRect(-hw + 1, -hh + 2 + i * 7, 2, 3);
      ctx.fillRect(hw - 3, -hh + 2 + i * 7, 2, 3);
    }

    // Turret circle
    ctx.fillStyle = this.flash > 0 ? '#ddd' : (this.isPlayer ? '#4a90d9' : '#c0392b');
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();

    // Barrel
    ctx.fillStyle = this.flash > 0 ? '#eee' : '#333';
    ctx.fillRect(-2, -hh - 2, 4, hh - 6);

    ctx.restore();

    // HP bar for tough enemies
    if (this.hp > 1) {
      ctx.fillStyle = '#333';
      ctx.fillRect(this.x, this.y - 6, this.w, 4);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(this.x, this.y - 6, this.w * (this.hp / 3), 4);
    }
  }

  canMove(nx, ny) {
    if (nx < 0 || ny < 0 || nx + this.w > W || ny + this.h > H) return false;
    // Check wall collisions
    for (let w of walls) {
      if (!w.alive) continue;
      if (nx < w.x + w.w && nx + this.w > w.x && ny < w.y + w.h && ny + this.h > w.y) return false;
    }
    // Check tank collisions
    let others = this.isPlayer ? enemies : (player && player.alive ? [player] : []);
    if (!this.isPlayer) {
      for (let e of enemies) {
        if (e === this || !e.alive) continue;
        if (nx < e.x + e.w && nx + this.w > e.x && ny < e.y + e.h && ny + this.h > e.y) return false;
      }
    } else {
      for (let e of enemies) {
        if (!e.alive) continue;
        if (nx < e.x + e.w && nx + this.w > e.x && ny < e.y + e.h && ny + this.h > e.y) return false;
      }
    }
    return true;
  }

  move(dir) {
    this.dir = dir;
    let nx = this.x + DX[dir] * this.speed;
    let ny = this.y + DY[dir] * this.speed;

    // Try to move, if blocked try sliding
    if (this.canMove(nx, ny)) {
      this.x = nx; this.y = ny;
      return true;
    }
    // Sliding: try moving in only one axis
    if (DX[dir] !== 0 && this.canMove(nx, this.y)) {
      this.x = nx;
      return true;
    }
    if (DY[dir] !== 0 && this.canMove(this.x, ny)) {
      this.y = ny;
      return true;
    }
    return false;
  }

  shoot() {
    if (this.cooldown > 0) return null;
    this.cooldown = this.cooldownMax;
    let bx = this.cx + DX[this.dir] * (this.h / 2 + 2) - 3;
    let by = this.cy + DY[this.dir] * (this.h / 2 + 2) - 3;
    let b = new Bullet(bx, by, this.dir, this.isPlayer, this);
    return b;
  }

  takeDamage() {
    this.hp--;
    this.flash = 8;
    if (this.hp <= 0) {
      this.alive = false;
      createExplosion(this.cx, this.cy, this.isPlayer ? '#4a90d9' : '#e74c3c');
      if (this.isPlayer) {
        game.lives--;
        updateUI();
        if (game.lives <= 0) gameOver();
        else respawnPlayer();
      } else {
        game.score += 100;
        spawnParticles(this.cx, this.cy, '#f39c12', 15);
        updateUI();
      }
    }
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
    if (this.flash > 0) this.flash--;
    if (this.shieldTimer > 0) this.shieldTimer--;
  }
}

class Bullet {
  constructor(x, y, dir, isPlayer, owner) {
    this.x = x; this.y = y;
    this.w = 6; this.h = 6;
    this.dir = dir;
    this.speed = isPlayer ? 5 : 3.5;
    this.alive = true;
    this.isPlayer = isPlayer;
    this.owner = owner;
    this.trail = [];
    this.damage = isPlayer ? 1 : 1;
    this.bounceCount = isPlayer ? 1 : 0;
  }

  draw() {
    if (!this.alive) return;
    // Trail
    for (let i = 0; i < this.trail.length; i++) {
      ctx.fillStyle = `rgba(255, 255, 200, ${0.15 * (1 - i / this.trail.length)})`;
      ctx.beginPath();
      ctx.arc(this.trail[i].x + 3, this.trail[i].y + 3, 3 - i * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = this.isPlayer ? '#ffeb3b' : '#ff6b6b';
    ctx.shadowColor = this.isPlayer ? '#ffeb3b' : '#ff6b6b';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner bright spot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.x + 3, this.y + 3, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  update() {
    if (!this.alive) return;

    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 5) this.trail.shift();

    this.x += DX[this.dir] * this.speed;
    this.y += DY[this.dir] * this.speed;

    // Wall bounce for player bullets
    if (this.isPlayer && this.bounceCount > 0) {
      if (this.x < 0 || this.x + this.w > W) {
        this.dir = (this.dir + 1) % 2 === 0 ? this.dir : this.dir;
        if (this.x < 0) this.x = 0;
        if (this.x + this.w > W) this.x = W - this.w;
        if (this.dir === DIR.LEFT) this.dir = DIR.RIGHT;
        else if (this.dir === DIR.RIGHT) this.dir = DIR.LEFT;
        this.bounceCount--;
        return;
      }
      if (this.y < 0 || this.y + this.h > H) {
        if (this.y < 0) this.y = 0;
        if (this.y + this.h > H) this.y = H - this.h;
        if (this.dir === DIR.UP) this.dir = DIR.DOWN;
        else if (this.dir === DIR.DOWN) this.dir = DIR.UP;
        this.bounceCount--;
        return;
      }
    }

    // Out of bounds
    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > H + 10) {
      this.alive = false;
      return;
    }

    // Wall collision
    for (let w of walls) {
      if (!w.alive) continue;
      if (this.x < w.x + w.w && this.x + this.w > w.x && this.y < w.y + w.h && this.y + this.h > w.y) {
        this.alive = false;
        w.takeDamage(this.damage);
        spawnParticles(this.x + 3, this.y + 3, '#aaa', 5);
        return;
      }
    }

    // Tank collision
    let targets = this.isPlayer ? enemies : (player && player.alive ? [player] : []);
    for (let t of targets) {
      if (!t.alive) continue;
      if (this.x < t.x + t.w && this.x + this.w > t.x && this.y < t.y + t.h && this.y + this.h > t.y) {
        this.alive = false;
        t.takeDamage(this.damage);
        return;
      }
    }

    // Bullet vs bullet
    for (let b of bullets) {
      if (b === this || !b.alive || b.isPlayer === this.isPlayer) continue;
      if (Math.abs(this.x - b.x) < 8 && Math.abs(this.y - b.y) < 8) {
        this.alive = false;
        b.alive = false;
        spawnParticles(this.x + 3, this.y + 3, '#fff', 8);
      }
    }
  }
}

class Wall {
  constructor(x, y, type = 'brick') {
    this.x = x; this.y = y;
    this.w = TILE; this.h = TILE;
    this.type = type;
    this.alive = true;
    this.hp = type === 'brick' ? 2 : 999;
    this.maxHp = this.hp;
    this.crackStage = 0;
  }

  draw() {
    if (!this.alive) return;
    if (this.type === 'brick') {
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(this.x, this.y, this.w, this.h);
      // Brick pattern
      ctx.strokeStyle = '#922b21';
      ctx.lineWidth = 1;
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 2; c++) {
          ctx.strokeRect(this.x + c * 15, this.y + r * 15, 15, 15);
        }
      }
      // Cracks based on damage
      if (this.hp === 1) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x + 5, this.y + 5);
        ctx.lineTo(this.x + 20, this.y + 20);
        ctx.moveTo(this.x + 25, this.y + 10);
        ctx.lineTo(this.x + 10, this.y + 25);
        ctx.stroke();
      }
    } else {
      // Steel wall
      let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y + this.h);
      grad.addColorStop(0, '#7f8c8d');
      grad.addColorStop(0.5, '#95a5a6');
      grad.addColorStop(1, '#7f8c8d');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x, this.y, this.w, this.h);
      ctx.strokeStyle = '#6c7a7a';
      ctx.lineWidth = 1;
      ctx.strokeRect(this.x + 2, this.y + 2, this.w - 4, this.h - 4);
      // Rivets
      ctx.fillStyle = '#5d6d6e';
      [
        [4, 4], [this.w - 4, 4],
        [4, this.h - 4], [this.w - 4, this.h - 4]
      ].forEach(([ox, oy]) => {
        ctx.beginPath();
        ctx.arc(this.x + ox, this.y + oy, 2, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  takeDamage(dmg) {
    this.hp -= dmg;
    if (this.hp <= 0) {
      this.alive = false;
      spawnParticles(this.x + this.w / 2, this.y + this.h / 2, this.type === 'brick' ? '#c0392b' : '#95a5a6', 10);
    }
  }
}

function createExplosion(x, y, color) {
  explosions.push({ x, y, r: 5, maxR: 30 + Math.random() * 10, color, timer: 0, maxTimer: 25 });
  spawnParticles(x, y, color, 20);
  // Screen shake
  screenShakeTimer = 5;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random() * Math.PI * 2;
    let speed = 1 + Math.random() * 4;
    particles.push({
      x, y, color,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 30 + Math.random() * 30,
      maxLife: 30 + Math.random() * 30,
      size: 2 + Math.random() * 3
    });
  }
}

let screenShakeTimer = 0;

// --- Level Generation ---
function generateLevel(level) {
  walls = [];
  enemies = [];
  bullets = [];
  explosions = [];
  particles = [];

  // Border walls? No, just boundaries

  // Inner walls - procedural layout
  const layouts = [
    // Level 1 - Simple
    () => {
      addBrickRow(5, 5, 10);
      addBrickRow(5, 15, 10);
      addBrickRow(5, 5, 10, false);
      addSteelGrid(0);
    },
    // Level 2
    () => {
      addBrickBox(3, 3, 4, 4);
      addBrickBox(13, 3, 4, 4);
      addBrickBox(3, 13, 4, 4);
      addBrickBox(13, 13, 4, 4);
      addSteelGrid(2);
    },
    // Level 3
    () => {
      addBrickRow(0, 7, 20);
      addBrickRow(0, 13, 20);
      addBrickRow(7, 0, 6, false);
      addBrickRow(14, 0, 6, false);
      addSteelGrid(4);
    },
    // Level 4
    () => {
      addBrickGrid();
      addSteelGrid(6);
    },
    // Level 5 - Fortress
    () => {
      addBrickBox(5, 5, 10, 10);
      addSteelGrid(8);
      // Corner steel
      for (let i = 0; i < 6; i++) {
        addWall(3 + i, 3, 'steel');
        addWall(16 - i, 16, 'steel');
      }
    }
  ];

  let layoutIdx = Math.min(level - 1, layouts.length - 1);
  layouts[layoutIdx]();

  // Add random scatter walls
  let extraCount = Math.min(level * 2, 15);
  for (let i = 0; i < extraCount; i++) {
    let x = Math.floor(Math.random() * 18) + 1;
    let y = Math.floor(Math.random() * 18) + 1;
    // Avoid player spawn area
    if (x < 3 && y < 3) continue;
    if (x > 16 && y < 3) continue;
    addWall(x, y, Math.random() > 0.2 ? 'brick' : 'steel');
  }

  function addWall(c, r, type = 'brick') {
    // Deduplicate
    for (let w of walls) {
      if (w.x === c * TILE && w.y === r * TILE) return;
    }
    walls.push(new Wall(c * TILE, r * TILE, type));
  }

  function addBrickRow(c, r, count, horizontal = true) {
    for (let i = 0; i < count; i++) {
      let x = horizontal ? c + i : c;
      let y = horizontal ? r : r + i;
      if (x >= 0 && x < COLS && y >= 0 && y < ROWS) addWall(x, y, 'brick');
    }
  }

  function addBrickBox(c, r, w, h) {
    for (let i = 0; i < w; i++) {
      for (let j = 0; j < h; j++) {
        if (c + i >= 0 && c + i < COLS && r + j >= 0 && r + j < ROWS) addWall(c + i, r + j, 'brick');
      }
    }
  }

  function addSteelGrid(count) {
    let positions = [
      [9, 9], [10, 9], [9, 10], [10, 10],  // center
      [4, 4], [15, 4], [4, 15], [15, 15],
    ];
    for (let i = 0; i < Math.min(count, positions.length); i++) {
      let [c, r] = positions[i];
      addWall(c, r, 'steel');
    }
  }

  function addBrickGrid() {
    for (let c = 2; c < COLS - 2; c += 3) {
      for (let r = 2; r < ROWS - 2; r += 3) {
        if (Math.random() > 0.3) addWall(c, r, 'brick');
      }
    }
  }
}

// --- AI ---
function updateAI(enemy) {
  if (!enemy.alive) return;

  enemy.aiChangeTimer--;
  enemy.shootTimer--;

  if (enemy.aiChangeTimer <= 0) {
    // Choose direction: prefer moving towards player
    if (player && player.alive) {
      let dx = player.cx - enemy.cx;
      let dy = player.cy - enemy.cy;
      // 60% chance to move toward player
      if (Math.random() < 0.6) {
        if (Math.abs(dx) > Math.abs(dy)) {
          enemy.aiDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
        } else {
          enemy.aiDir = dy > 0 ? DIR.DOWN : DIR.UP;
        }
      } else {
        enemy.aiDir = Math.floor(Math.random() * 4);
      }
    } else {
      enemy.aiDir = Math.floor(Math.random() * 4);
    }
    enemy.aiChangeTimer = 30 + Math.floor(Math.random() * 60);
  }

  // Try to move; if blocked, change direction
  if (!enemy.move(enemy.aiDir)) {
    enemy.aiDir = Math.floor(Math.random() * 4);
    enemy.aiChangeTimer = 20;
  }

  // Shooting
  if (enemy.shootTimer <= 0) {
    // Shoot if facing player roughly
    let canShoot = false;
    if (player && player.alive) {
      let dx = player.cx - enemy.cx;
      let dy = player.cy - enemy.cy;
      if (enemy.dir === DIR.UP && dy < 0 && Math.abs(dx) < 30) canShoot = true;
      if (enemy.dir === DIR.DOWN && dy > 0 && Math.abs(dx) < 30) canShoot = true;
      if (enemy.dir === DIR.LEFT && dx < 0 && Math.abs(dy) < 30) canShoot = true;
      if (enemy.dir === DIR.RIGHT && dx > 0 && Math.abs(dy) < 30) canShoot = true;
    }
    if (canShoot || Math.random() < 0.02) {
      let b = enemy.shoot();
      if (b) bullets.push(b);
      enemy.shootTimer = enemy.shootDelay;
    }
  }

  enemy.update();
}

// --- Player ---
function respawnPlayer() {
  // Pick a safe spawn
  let spawnX = TILE * 2, spawnY = TILE * 17;
  // Try three spawn points
  const spawns = [[TILE, TILE], [TILE * 18, TILE], [TILE * 9, TILE * 18]];
  for (let s of spawns) {
    let safe = true;
    for (let e of enemies) {
      if (!e.alive) continue;
      if (Math.abs(s[0] - e.x) < TILE * 2 && Math.abs(s[1] - e.y) < TILE * 2) {
        safe = false;
        break;
      }
    }
    if (safe) { spawnX = s[0]; spawnY = s[1]; break; }
  }

  player = new Tank(spawnX, spawnY, '#2ecc71', true);
  player.shieldTimer = 120;
}

// --- Spawning ---
function spawnEnemy() {
  if (enemyCount >= TOTAL_ENEMIES_PER_LEVEL) return;
  if (enemies.filter(e => e.alive).length >= MAX_ENEMIES) return;

  const spawnPoints = [
    [TILE, TILE],
    [TILE * (COLS - 2), TILE],
    [TILE * Math.floor(COLS / 2 - 1), TILE]
  ];

  let sp = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];

  // Check no tank at spawn
  for (let e of enemies) {
    if (!e.alive) continue;
    if (Math.abs(e.x - sp[0]) < TILE * 2 && Math.abs(e.y - sp[1]) < TILE * 2) return;
  }
  if (player && player.alive && Math.abs(player.x - sp[0]) < TILE * 2 && Math.abs(player.y - sp[1]) < TILE * 2) return;

  let hp = 1;
  let speed = 1.2;
  let color = '#e74c3c';

  // Tougher enemies at higher levels
  let r = Math.random();
  if (game.level >= 3 && r < 0.2) { hp = 3; color = '#8e44ad'; } // Heavy tank
  else if (game.level >= 2 && r < 0.4) { hp = 2; color = '#e67e22'; }

  let enemy = new Tank(sp[0], sp[1], color, false);
  enemy.hp = hp;
  enemy.speed = speed;
  enemy.shieldTimer = 60;
  enemies.push(enemy);
  enemyCount++;
}

function checkLevelComplete() {
  if (enemyCount >= TOTAL_ENEMIES_PER_LEVEL && enemies.filter(e => e.alive).length === 0) {
    return true;
  }
  return false;
}

function nextLevel() {
  game.level++;
  game.won = true;
  setTimeout(() => {
    game.won = false;
    enemyCount = 0;
    spawnTimer = 0;
    generateLevel(game.level);
    respawnPlayer();
  }, 2000);
}

function gameOver() {
  game.over = true;
  createExplosion(player.cx, player.cy, '#e74c3c');
}

// --- UI ---
function updateUI() {
  scoreEl.textContent = game.score;
  enemiesEl.textContent = TOTAL_ENEMIES_PER_LEVEL - enemyCount + enemies.filter(e => e.alive).length;
  livesEl.textContent = game.lives;
}

// --- Input ---
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  keys[e.key] = true;
  if (e.key === 'p' || e.key === 'P') game.paused = !game.paused;
  // Prevent scrolling with space
  if (e.key === ' ') e.preventDefault();
});

document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  keys[e.key] = false;
});

// --- Main Loop ---
function update() {
  if (game.over || game.paused || game.won) return;

  // Player
  if (player && player.alive) {
    let moved = false;
    if (keys['w'] || keys['arrowup']) { player.move(DIR.UP); moved = true; }
    else if (keys['s'] || keys['arrowdown']) { player.move(DIR.DOWN); moved = true; }
    else if (keys['a'] || keys['arrowleft']) { player.move(DIR.LEFT); moved = true; }
    else if (keys['d'] || keys['arrowright']) { player.move(DIR.RIGHT); moved = true; }

    if (keys[' '] || keys['Space']) {
      let b = player.shoot();
      if (b) bullets.push(b);
    }
    player.update();
  }

  // Enemy AI
  for (let e of enemies) {
    if (e.alive) updateAI(e);
  }

  // Bullets
  for (let b of bullets) {
    if (b.alive) b.update();
  }
  bullets = bullets.filter(b => b.alive);

  // Remove dead enemies (keep reference for enemyCount tracking)
  enemies = enemies.filter(e => e.alive || enemies.indexOf(e) > -1);

  // Spawn enemies
  spawnTimer++;
  let spawnRate = Math.max(60, 180 - game.level * 15);
  if (spawnTimer >= spawnRate) {
    spawnTimer = 0;
    spawnEnemy();
  }

  // Particles
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Explosions
  for (let e of explosions) {
    e.timer++;
    e.r += (e.maxR - e.r) * 0.15;
  }
  explosions = explosions.filter(e => e.timer < e.maxTimer);

  if (screenShakeTimer > 0) screenShakeTimer--;

  // Check level complete
  if (checkLevelComplete()) nextLevel();

  updateUI();
}

function draw() {
  ctx.save();

  if (screenShakeTimer > 0) {
    let intensity = screenShakeTimer * 0.5;
    ctx.translate(
      (Math.random() - 0.5) * intensity,
      (Math.random() - 0.5) * intensity
    );
  }

  // Background
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(0, 0, W, H);

  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, H); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(W, i * TILE); ctx.stroke();
  }

  // Walls
  for (let w of walls) w.draw();

  // Bullets
  for (let b of bullets) b.draw();

  // Enemies
  for (let e of enemies) e.draw();

  // Player
  if (player) player.draw();

  // Particles
  for (let p of particles) {
    let alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Explosions
  for (let e of explosions) {
    let alpha = 1 - e.timer / e.maxTimer;
    ctx.globalAlpha = alpha * 0.6;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Overlay messages
  if (game.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f39c12';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('暂停', W / 2, H / 2 - 20);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px Arial';
    ctx.fillText('按 P 继续', W / 2, H / 2 + 30);
  }

  if (game.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', W / 2, H / 2 - 20);
    ctx.fillStyle = '#aaa';
    ctx.font = '20px Arial';
    ctx.fillText('得分: ' + game.score, W / 2, H / 2 + 40);
  }

  if (game.won) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('第 ' + game.level + ' 关 通过!', W / 2, H / 2 - 10);
    ctx.fillStyle = '#aaa';
    ctx.font = '18px Arial';
    ctx.fillText('准备下一关...', W / 2, H / 2 + 40);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// --- Init ---
function initGame() {
  game = { score: 0, lives: 3, level: 1, paused: false, over: false, won: false };
  enemyCount = 0;
  spawnTimer = 0;
  generateLevel(1);
  respawnPlayer();
  updateUI();
}

document.getElementById('restartBtn').addEventListener('click', initGame);

initGame();
gameLoop();
</script>
</body>
</html>
