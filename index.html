<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
  }
  .game-wrapper {
    background: #16213e;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: #e0e0e0;
  }
  .game-title { font-size: 20px; font-weight: bold; color: #f39c12; letter-spacing: 2px; }
  .game-stats { display: flex; gap: 24px; font-size: 14px; }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat-value { color: #f39c12; font-weight: bold; font-size: 16px; }
  canvas {
    display: block;
    border: 3px solid #0f3460;
    border-radius: 6px;
    background: #2d2d2d;
  }
  .game-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    color: #888;
    font-size: 12px;
  }
  .controls-hint span { color: #f39c12; }
  button {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background 0.2s;
  }
  button:hover { background: #c0392b; }
  button:active { transform: scale(0.96); }

  /* Menu overlay */
  #menuOverlay {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1a1a2e;
    z-index: 100;
  }
  .menu-panel {
    background: #16213e;
    padding: 40px 50px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    text-align: center;
    min-width: 320px;
  }
  .menu-panel h1 {
    color: #f39c12;
    font-size: 42px;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .menu-panel h2 {
    color: #f39c12;
    font-size: 28px;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .menu-panel .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 30px;
  }
  .menu-btn {
    display: block;
    width: 100%;
    padding: 14px 0;
    margin: 10px 0;
    font-size: 18px;
    border-radius: 6px;
    background: #0f3460;
    color: #e0e0e0;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
  }
  .menu-btn:hover {
    background: #1a4a7a;
    border-color: #f39c12;
    color: #f39c12;
  }
  .menu-btn.primary {
    background: #e67e22;
    color: #fff;
  }
  .menu-btn.primary:hover {
    background: #d35400;
    border-color: #fff;
  }
  .menu-btn.secondary {
    background: #7f8c8d;
    color: #fff;
  }
  .menu-btn.secondary:hover {
    background: #6c7a7a;
    border-color: #f39c12;
  }
  .menu-btn:active { transform: scale(0.96); }
  .room-code {
    font-size: 56px;
    font-weight: bold;
    color: #f39c12;
    letter-spacing: 12px;
    margin: 20px 0;
    font-family: 'Courier New', monospace;
  }
  .menu-input {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 28px;
    text-align: center;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: #0f3460;
    border: 2px solid #0f3460;
    border-radius: 6px;
    color: #f39c12;
    font-family: 'Courier New', monospace;
    margin: 10px 0 20px;
    outline: none;
  }
  .menu-input:focus {
    border-color: #f39c12;
  }
  .menu-input::placeholder {
    font-size: 16px;
    letter-spacing: 2px;
    color: #555;
  }
  .menu-notice {
    color: #e74c3c;
    font-size: 14px;
    margin-top: 10px;
    min-height: 20px;
  }
  .menu-loading {
    color: #888;
    font-size: 14px;
    margin: 10px 0;
  }
  .loading-dots::after {
    content: '';
    animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
    100% { content: ''; }
  }
  #networkNotice {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(231, 76, 60, 0.9);
    color: #fff;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 200;
  }
  .network-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .network-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2ecc71;
    display: inline-block;
  }
</style>
</head>
<body>
<div id="networkNotice"></div>

<!-- Menu Overlay -->
<div id="menuOverlay">
  <div class="menu-panel">
    <!-- Main Menu -->
    <div id="mainMenu">
      <h1>&#x1F4A5; 坦克大战</h1>
      <div class="subtitle">经典坦克对战游戏</div>
      <button class="menu-btn primary" id="singleBtn">单人游戏</button>
      <button class="menu-btn" id="multiBtn">联机游戏</button>
    </div>

    <!-- Multiplayer Menu -->
    <div id="multiMenu" style="display:none">
      <h2>联机游戏</h2>
      <div class="subtitle">通过局域网联机合作闯关</div>
      <button class="menu-btn primary" id="hostBtn">创建房间</button>
      <button class="menu-btn" id="joinBtn">加入房间</button>
      <button class="menu-btn secondary" id="backBtn">返回</button>
    </div>

    <!-- Host Waiting -->
    <div id="hostWait" style="display:none">
      <h2>创建房间</h2>
      <div id="roomCodeDisplay" class="room-code">----</div>
      <div class="subtitle">将房间码告知你的队友</div>
      <div class="menu-loading">等待队友加入...</div>
      <div id="hostNotice" class="menu-notice"></div>
      <button class="menu-btn secondary" id="cancelHostBtn" style="margin-top:20px">取消</button>
    </div>

    <!-- Join Panel -->
    <div id="joinPanel" style="display:none">
      <h2>加入房间</h2>
      <div class="subtitle">输入对方的房间码</div>
      <input type="text" class="menu-input" id="roomCodeInput" maxlength="4" placeholder="房间码">
      <button class="menu-btn primary" id="submitJoinBtn">加入</button>
      <div id="joinNotice" class="menu-notice"></div>
      <button class="menu-btn secondary" id="cancelJoinBtn" style="margin-top:10px">返回</button>
    </div>
  </div>
</div>

<!-- Game -->
<div class="game-wrapper" id="gameWrapper">
  <div class="game-header">
    <div class="game-title">&#x1F4A5; 坦克大战</div>
    <div class="game-stats">
      <div class="stat">&#x1F4AF; 分数 <span class="stat-value" id="score">0</span></div>
      <div class="stat">&#x2620; 敌人 <span class="stat-value" id="enemies">0</span></div>
      <div class="stat">&#x2764; 生命 <span class="stat-value" id="lives">3</span></div>
      <div class="network-indicator" id="netIndicator" style="display:none">
        <span class="network-dot"></span> 已联机
      </div>
    </div>
  </div>
  <canvas id="gameCanvas" width="600" height="600"></canvas>
  <div class="game-footer">
    <div class="controls-hint">
      <span>WASD</span> 移动 &nbsp; <span>空格</span> 射击 &nbsp; <span>Q</span> 护盾 &nbsp; <span>E</span> 强击 &nbsp; <span>P</span> 暂停
    </div>
    <button id="restartBtn">重新开始</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
